{% extends "planner/base.html" %}
{# course_form.html -- add a class or activity (UC-09). #}
{% block title %}Add a class - Campus Hub{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card hub-card"><div class="card-body p-4">
    <h1 class="h3 mb-3">Add a class or activity</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name" value="{{ data.name }}" placeholder="Software Engineering" required autofocus>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-8">
                <label class="form-label" for="code">Code (optional)</label>
                <input class="form-control" id="code" name="code" value="{{ data.code }}" placeholder="CS312">
            </div>
            <div class="col-4">
                <label class="form-label" for="color">Color</label>
                {# type="color" makes the browser show a color picker. #}
                <input class="form-control form-control-color w-100" id="color" name="color" type="color" value="{{ data.color|default:'#0d6efd' }}">
            </div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" id="is_activity" name="is_activity" type="checkbox" {% if data.is_activity %}checked{% endif %}>
            <label class="form-check-label" for="is_activity">This is an activity (club, job...), not a class</label>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'course_list' %}">Cancel</a>
    </form>
</div></div>
</div></div>
{% endblock %}
